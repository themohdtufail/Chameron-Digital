name: AI Team Task
description: Submit a structured task for the Chameron AI team
title: "[AI Task]: "
labels: ["ai-task"]
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Software development
        - Marketing and sales
        - Research
        - Business planning
        - Operations
        - Documentation
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target product, repository, or business area
      placeholder: "e.g. BILL OS — themohdtufail/BILL-OS"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not just the activity.
      placeholder: "What should be true when this task is finished?"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Include what must not change, budget limits, audience, and deadline if relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List testable checks or evidence needed to accept the work.
      placeholder: "- [ ] ... "
    validations:
      required: true
  - type: dropdown
    id: approval
    attributes:
      label: Approval level
      options:
        - Planning/research/draft only
        - Code or document changes on a branch
        - External side effect requested — wait for owner approval
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I have not included passwords, API keys, private customer data, or other secrets.
          required: true
